name: paxbook-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: paxbook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: paxbook
      POSTGRES_PASSWORD: paxbook_dev_password
      POSTGRES_DB: paxbook
    ports:
      - "5432:5432"
    volumes:
      - paxbook_postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paxbook -d paxbook"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: paxbook-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - paxbook_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  paxbook_postgres_data:
  paxbook_redis_data:
